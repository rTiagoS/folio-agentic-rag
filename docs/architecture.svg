<text x="1396" y="786" class="small">Chooses when and where to search.</text>
<text x="1396" y="829" class="title" font-size="21">Deterministic retrieval</text>
<text x="1396" y="861" class="small">Returns evidence, not an LLM answer.</text>
<text x="58" y="1134" class="micro">Current prototype • models shown match .env.example • external services are reached over HTTPS</text>
