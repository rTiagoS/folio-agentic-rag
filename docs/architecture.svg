<text x="474" y="310" class="title">ReAct agent</text>
<text x="424" y="347" class="body">LangChain create_agent</text>
<text x="424" y="374" class="body">Decide → act → observe</text>
<text x="424" y="401" class="body">Answer or search again</text>
<text x="424" y="428" class="body">Up to 3 searches / turn</text>
