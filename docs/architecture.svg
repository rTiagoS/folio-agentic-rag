<path d="M580 264 V248 H1374 V340 H1414" class="wire" marker-start="url(#arrow)"/>
<text x="1018" y="183" class="micro">model requests / responses</text>
<path d="M1308 391 H1374 V558 H1414" class="data"/>
<text x="1318" y="438" class="micro">query</text>
<path d="M597 814 V917 H1374 V600 H1414" class="data"/>
<text x="1120" y="910" class="micro">document embeddings</text>
<rect x="56" y="990" width="1712" height="110" rx="18" fill="#f5f0fa" stroke="#cbb9dd" stroke-width="1.5"/>
<text x="80" y="1031" class="title">LangSmith · optional tracing</text>
<text x="80" y="1067" class="body">Agent, model and tool runs • thread / turn correlation • content capture is configurable</text>
<path d="M1083 936 V990" fill="none" stroke="#8b6ab1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#trace)"/>
<text x="1110" y="971" class="micro">traces</text>
