<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title description">
<title id="title">Folio — Prototype architecture</title>
<desc id="description">A local Docker application with Gradio and one LangChain ReAct-style agent. Uploaded PDF and TXT files are extracted, chunked, embedded through Gemini and stored in an InMemoryVectorStore. The agent queries that store through deterministic retrieval, uses Gemini Flash Lite to answer, and keeps checkpoints in InMemorySaver. State is isolated per browser session and disappears on refresh or restart. LangSmith tracing is optional.</desc>
<defs>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".08"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
 <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#32836b"/></marker>
 <marker id="trace" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#8b6ab1"/></marker>
</defs>
