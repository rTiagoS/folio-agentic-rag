<rect x="56" y="594" width="1276" height="300" rx="20" fill="#fff2ef" stroke="#e5c1ba" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="78" y="631" class="label">SESSION STATE · RAM · ISOLATED PER BROWSER SESSION</text>
<rect x="76" y="666" width="316" height="148" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1.5" filter="url(#shadow)"/>
<text x="98" y="712" class="title">InMemorySaver</text>
<text x="98" y="749" class="body">Conversation checkpoints</text>
<text x="98" y="776" class="body">thread_id = session ID</text>
<text x="98" y="803" class="body">No durable chat history</text>
<rect x="436" y="666" width="322" height="148" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1.5" filter="url(#shadow)"/>
<text x="458" y="712" class="title">On upload → index</text>
<text x="458" y="749" class="body">pypdf / UTF-8 TXT extraction</text>
<text x="458" y="776" class="body">1,200 chars · 180 overlap</text>
<text x="458" y="803" class="body">Embed new chunks only</text>
<rect x="858" y="666" width="450" height="148" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1.5" filter="url(#shadow)"/>
<text x="880" y="712" class="title">InMemoryVectorStore</text>
<text x="880" y="749" class="body">Passages + vectors + file/page data</text>
<text x="880" y="776" class="body">New uploads extend the catalog</text>
<text x="880" y="803" class="body">PDF chunks stay within each page</text>
<path d="M580 498 V563 H44 V740 H76" class="wire" marker-start="url(#arrow)"/>
