<path d="M1083 498 V666" class="wire" marker-start="url(#arrow)"/>
<rect x="1110" y="554" width="186" height="32" rx="6" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="1120" y="576" class="micro">retrieve passages</text>
<path d="M758 739 H858" class="data"/>
<text x="808" y="718" class="micro" text-anchor="middle">index</text>
<text x="78" y="852" class="small">New chat / refresh / restart → fresh session.</text>
<text x="78" y="880" class="small">No persistent database or login.</text>
<rect x="1392" y="198" width="376" height="504" rx="20" fill="#f5f0fa" stroke="#cbb9dd" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1414" y="233" class="label">EXTERNAL API SERVICES</text>
<rect x="1414" y="264" width="332" height="154" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1436" y="310" class="title">Gemini Developer API</text>
<text x="1436" y="347" class="body">gemini-3.1-flash-lite</text>
<text x="1436" y="374" class="body">Model decisions + final answer</text>
<rect x="1414" y="482" width="332" height="154" rx="16" fill="#fff" stroke="#dce4ee" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1436" y="528" class="title">Embedding API</text>
<text x="1436" y="565" class="body">gemini-embedding-001</text>
